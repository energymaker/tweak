# Builds the Windows installer on every tag and keeps it as a run artifact, so
# you never build locally. Attaching it to a release is a separate step that is
# allowed to fail without failing the build.
name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build
        run: npx electron-builder --win --publish never
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: Tweak-installer
          path: dist/*.exe
          if-no-files-found: error
      - name: Attach it to a release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
          fail_on_unmatched_files: false
